[project]
name = "vlstat-analyse"
version = "0.1.0"
description = "Analytics for Danish weightlifting results (2019 onward)"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.147.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "lxml>=5.0",
    "playwright>=1.45",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
