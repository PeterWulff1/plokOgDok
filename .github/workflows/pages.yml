# Builds Pløk og Døk as static pages and publishes them on GitHub Pages.
# Every night it first syncs the calendar from vaegtloeftning.dk (one request), then
# rebuilds every page from the database. Pushes to main rebuild (without syncing) only
# when they change something the pages are made from.
# Secrets (Settings -> Secrets and variables -> Actions): DATABASE_URL_READ and
# DATABASE_URL_CALENDAR. The calendar role can only write vl.calendar_event (migration 020);
# the full write role is never given to this workflow.
# Actions are pinned to commits, since a tag can be moved to other code. Update the hash
# and the version comment together.
name: Byg og udgiv siden

on:
  schedule:
    - cron: "0 4 * * *" # 05:00/06:00 Danish time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "db/queries.py"
      - "db/migrations/**"
      - "scripts/build_static.py"
      - "scripts/check_site.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site's settings
    timeout-minutes: 60
    # A newer run makes an older build pointless, so cancel it.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - run: uv sync --frozen

      - name: Sync calendar
        if: github.event_name != 'push'
        # A calendar hiccup shouldn't stop the rest of the site from being rebuilt.
        continue-on-error: true
        run: uv run python -m scraper.fetch_calendar
        env:
          DATABASE_URL_CALENDAR: ${{ secrets.DATABASE_URL_CALENDAR }}

      - name: Build site
        run: uv run python -m scripts.build_static --base "/${{ github.event.repository.name }}"
        env:
          DATABASE_URL_READ: ${{ secrets.DATABASE_URL_READ }}

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Never cancel a deployment halfway.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
